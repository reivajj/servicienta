                          technician_id: 0f095605-b76a-45c5-8bd6-0551d3845d22
                          status: pending
                          flow_type: client_selects
                          description: Heladera no enfría
                          service_address_text: Calle Falsa 123
                          service_lat: -34.6037
                          service_lng: -58.3816
                          address_notes: Timbre 2, piso 4
                          zone_slug: caballito
                          appliance_type_slug: heladeras
                          created_at: '2026-05-03T14:00:00.000Z'
                          updated_at: '2026-05-03T14:00:00.000Z'
