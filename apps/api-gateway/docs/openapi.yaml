  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get current client order by id
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderResponse'
