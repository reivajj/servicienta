openapi: 3.1.0
info:
  title: Servicienta API Gateway
  version: 0.1.0
  description: |
    OpenAPI specification for the current Express API Gateway.

    Notes:
    - Most application responses use the `{ data: ... }` envelope.
    - Error responses use `{ error, requestId }`.
    - `/health` is the only endpoint that does not use the standard envelope.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
  - name: Users
  - name: Client Profiles
  - name: Orders
  - name: Operations
  - name: Chat
  - name: Technician Profiles
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                success:
                  value:
                    ok: true
  /api/users/current:
    get:
      tags: [Users]
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update current authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
            examples:
              updateCurrentUser:
                value:
                  name: Javier
                  surname: Gómez
                  role: client
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users:
    get:
      tags: [Users]
      summary: List users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: 5dbf6e6c-0b31-47f2-920f-e1d52a146111
                          email: javier@example.com
                          name: Javier
                          surname: Gómez
                          role: client
                          status: ACTIVE
                          deleted_at: null
                          created_at: '2026-05-01T10:30:00.000Z'
                      pagination:
                        page: 1
                        pageSize: 25
                        total: 1
                        totalPages: 1
                      summary:
                        totalUsers: 1
                        activeUsers: 1
                        deletedUsers: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}:
    get:
      tags: [Users]
      summary: Get user by id
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update user by id
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
            examples:
              updateUser:
                value:
                  name: Kiara
                  surname: Pérez
                  role: technician
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Soft delete user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}/restore:
    patch:
      tags: [Users]
      summary: Restore soft deleted user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
